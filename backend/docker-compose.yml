services:
  postgres:
    image: postgres:16-alpine
    container_name: tiKets-postgres-0032
    restart: unless-stopped
    ports:
      - '55432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tiKets
    volumes:
      - postgres_data_0032:/var/lib/postgresql/data

volumes:
  postgres_data_0032:
